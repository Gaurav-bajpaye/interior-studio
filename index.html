    <style>
      /* First-paint shell — replaced the instant React mounts.
         Keeps the load from flashing an empty white page. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fcfaf6;
        z-index: 100;
        transition: opacity 0.5s ease, visibility 0.5s;
      }
      #boot.done {
        opacity: 0;
        visibility: hidden;
      }
      #boot svg {
        width: 74px;
        height: auto;
        animation: bootIn 1.4s ease-in-out infinite alternate;
      }
      @keyframes bootIn {
        from {
          opacity: 0.35;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
